{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<section class="section">
  <div class="container">
    <div class="error-box">
      <p class="error-code">{{ code }}</p>
      <h1>{{ title }}</h1>
      <p>{{ message }}</p>
      <div class="error-actions">
        <a href="{{ url_for('index') }}" class="btn btn-primary">Go to Homepage</a>
        <a href="{{ url_for('properties') }}" class="btn btn-outline">Browse Properties</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
